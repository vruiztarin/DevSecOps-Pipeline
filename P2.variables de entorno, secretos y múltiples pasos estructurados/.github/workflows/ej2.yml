name: Ejercicio 2 - Variables y Secretos

on:
  push:

env:
  ENTORNO: "PRO" #Nos permite definir el entorno

jobs:
  info-entorno:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mostrar información del entorno
        run: |
          echo "Iniciando pipeline en el entorno: $ENTORNO"
          echo "Ejecutado por el usuario: ${{ github.actor }}"

      

  token-seguro:
    runs-on: ubuntu-latest

    steps:
      - name: Validar secreto de autenticación
        env:
          TOKEN: ${{ secrets.API_TOKEN_SIMULADO }} # Esta variable solo se utiliza en este step
        run: |
          echo "Comprobando si el token está disponible..."
          if [ -n "$TOKEN" ]; then
            echo "Token detectado con éxito."
          else
            echo "Error: Token no encontrado."
            exit 1 
          fi