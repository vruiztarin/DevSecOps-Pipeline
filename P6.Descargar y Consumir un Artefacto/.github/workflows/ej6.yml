name: Gestion de arfectos
on:
  push:

jobs:
  crear-carpeta:
    runs-on: ubuntu-latest
    steps:
      - run: |
            mkdir resultados
            echo "Prueba en la primera linea" > prueba.txt
            echo "Prueba de la segunda linea" >> prueba.txt
            mv prueba.txt resultados/
      - uses: actions/upload-artifact@v4
        with:
          name: prueba
          path: resultados/
  descargar:
    needs: crear-carpeta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
      - run: |
            ls
            cat prueba.txt
